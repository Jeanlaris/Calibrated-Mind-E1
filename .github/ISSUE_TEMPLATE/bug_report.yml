name: Bug Report
description: File a bug report to help us improve the architecture.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Bug Description
      description: Clearly and concisely describe what the bug is.
      placeholder: Describe the issue here...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to replicate the behavior.
      placeholder: "1. Go to...\n2. Click on...\n3. Scroll down..."
    validations:
      required: true
